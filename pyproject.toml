[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-job-proxy"
version = "1.0.0"
description = "Application-agnostic filesystem job proxy"
authors = [{ name = "Joe Schonbok" }]
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.11,<4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
file-proxy = "file_proxy.cli:main"

[tool.setuptools.packages.find]
include = ["file_proxy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
